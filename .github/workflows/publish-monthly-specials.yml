name: Publish Monthly Specials PDF

on:
  workflow_dispatch:
    inputs:
      google_sheet_id:
        description: "Optional Google Sheet ID. Leave empty to use repository variable MONTHLY_SPECIALS_GOOGLE_SHEET_ID."
        required: false
        type: string
      commit_message:
        description: "Commit message for the generated monthly specials PDF."
        required: false
        default: "chore: publish monthly specials pdf"
        type: string

concurrency:
  group: publish-monthly-specials-pdf
  cancel-in-progress: false

jobs:
  build:
    name: Build monthly specials PDF and site
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      MONTHLY_SPECIALS_SOURCE: google
      MONTHLY_SPECIALS_ALLOW_JSON_FALLBACK: "false"
      MONTHLY_SPECIALS_V2_PUBLISH: "true"
      GOOGLE_SHEET_SETTINGS_NAME: Settings
      GOOGLE_SHEET_CONTACTS_NAME: Contacts
      GOOGLE_SHEET_SPECIALS_NAME: Specials

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Choose Google Sheet ID
        shell: bash
        run: |
          SHEET_ID="${{ inputs.google_sheet_id }}"
          if [ -z "$SHEET_ID" ]; then
            SHEET_ID="${{ vars.MONTHLY_SPECIALS_GOOGLE_SHEET_ID }}"
          fi

          if [ -z "$SHEET_ID" ]; then
            echo "GOOGLE_SHEET_ID is missing."
            echo "Set repository variable MONTHLY_SPECIALS_GOOGLE_SHEET_ID or provide workflow input google_sheet_id."
            exit 1
          fi

          echo "GOOGLE_SHEET_ID=$SHEET_ID" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build monthly specials PDF
        run: npm run specials:v2:build

      - name: Verify Google Sheets source
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("public/specials/monthly-specials.json", "utf8"));

          if (!data.source || data.source.type !== "google") {
            console.error("Expected public/specials/monthly-specials.json source.type to be google.");
            process.exit(1);
          }

          if (!Array.isArray(data.specials) || data.specials.length < 1 || data.specials.length > 4) {
            console.error("Expected between 1 and 4 active specials.");
            process.exit(1);
          }

          const missingImages = data.specials.filter((item) => !item.primaryImagePath);
          if (missingImages.length > 0) {
            console.error("Every active special must include Primary Image Path.");
            process.exit(1);
          }

          const invalidDualOffers = data.specials.filter(
            (item) => item.offerMode === "dual-offer" && !item.secondaryImagePath,
          );
          if (invalidDualOffers.length > 0) {
            console.error("Every dual-offer special must include Secondary Image Path.");
            process.exit(1);
          }

          console.log(`Verified Google Sheets V2 source with ${data.specials.length} active specials.`);
          NODE

      - name: Verify Studio visual authority
        run: node tools/verify-monthly-specials-visual-parity.mjs public/specials/monthly-specials.json

      - name: Verify PDF page count
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const pdf = fs.readFileSync("public/specials/monthly-specials.pdf", "latin1");
          const pages = pdf.match(/\/Type\s*\/Page\b/g) || [];

          console.log(`PDF page count estimate: ${pages.length}`);

          if (pages.length !== 1) {
            console.error("Expected monthly specials PDF to be exactly 1 page.");
            process.exit(1);
          }

          if (!/\/MediaBox\s*\[\s*0\s+0\s+612\s+1008\s*\]/.test(pdf)) {
            console.error("Expected monthly specials PDF to use US Legal MediaBox 0 0 612 1008.");
            process.exit(1);
          }

          console.log("Verified one-page US Legal PDF.");
          NODE

      - name: Build website
        run: npm run build

      - name: Commit updated monthly specials files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/specials/monthly-specials.pdf
          git add public/specials/monthly-specials.html
          git add public/specials/monthly-specials.json
          git add public/specials/index.html

          if git diff --cached --quiet; then
            echo "No monthly specials changes to commit."
          else
            git commit -m "${{ inputs.commit_message }}"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy site to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5