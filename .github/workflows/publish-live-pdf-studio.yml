name: Paragon Studio Production Publish
run-name: Paragon Studio Publish ${{ inputs.publish_id }}

on:
  workflow_dispatch:
    inputs:
      publish_id:
        description: Canonical lowercase publication UUID
        required: true
        type: string
      draft_branch:
        description: Exact studio-publish publication branch
        required: true
        type: string
      draft_commit:
        description: Exact staged publication commit
        required: true
        type: string
      base_main_sha:
        description: Main SHA used to create the staged publication
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paragon-studio-production-${{ inputs.publish_id }}
  cancel-in-progress: false

jobs:
  production-gate:
    name: Production gate
    runs-on: ubuntu-latest
    steps:
      - name: Require repository production gate
        env:
          PARAGON_STUDIO_PRODUCTION_ENABLED: ${{ vars.PARAGON_STUDIO_PRODUCTION_ENABLED }}
        run: |
          if [ "$PARAGON_STUDIO_PRODUCTION_ENABLED" != "true" ]; then
            echo "::error title=PUBLISHING_DISABLED::Paragon Studio production publishing is disabled."
            exit 1
          fi

  conflict-gate:
    name: Conflict gate
    needs: production-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact draft commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.draft_commit }}
          fetch-depth: 2
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate dispatch inputs and pre-build conflict state
        run: >-
          node tools/paragon-live-pdf-workflow/validate-conflict-state.mjs
          --phase pre-build
          --publish-id "${{ inputs.publish_id }}"
          --draft-branch "${{ inputs.draft_branch }}"
          --draft-commit "${{ inputs.draft_commit }}"
          --base-main-sha "${{ inputs.base_main_sha }}"

  build-shadow:
    name: Build shadow and production package
    needs: conflict-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact draft commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.draft_commit }}
          fetch-depth: 2
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Run publication workflow contracts
        run: npm run studio:workflow:test
      - name: Build temporary shadow publication
        env:
          PUBLICATION_EVIDENCE_ROOT: ${{ runner.temp }}/paragon-studio-publication
        run: >-
          node tools/paragon-live-pdf-workflow/build-shadow-publication.mjs
          --output "$PUBLICATION_EVIDENCE_ROOT/shadow"
      - name: Validate temporary shadow publication
        env:
          PUBLICATION_EVIDENCE_ROOT: ${{ runner.temp }}/paragon-studio-publication
        run: >-
          node tools/paragon-live-pdf-workflow/validate-shadow-publication.mjs
          --output "$PUBLICATION_EVIDENCE_ROOT/shadow"
      - name: Prepare exact production package
        env:
          PUBLICATION_EVIDENCE_ROOT: ${{ runner.temp }}/paragon-studio-publication
        run: >-
          node tools/paragon-live-pdf-workflow/prepare-production-publication.mjs
          --shadow "$PUBLICATION_EVIDENCE_ROOT/shadow"
          --output "$PUBLICATION_EVIDENCE_ROOT/production"
          --publish-id "${{ inputs.publish_id }}"
          --draft-commit "${{ inputs.draft_commit }}"
          --base-main-sha "${{ inputs.base_main_sha }}"
      - name: Verify website production build
        run: npm run build
      - name: Recheck post-build conflict state
        run: >-
          node tools/paragon-live-pdf-workflow/validate-conflict-state.mjs
          --phase post-build
          --publish-id "${{ inputs.publish_id }}"
          --draft-branch "${{ inputs.draft_branch }}"
          --draft-commit "${{ inputs.draft_commit }}"
          --base-main-sha "${{ inputs.base_main_sha }}"
      - name: Upload seven-day publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: paragon-studio-publication-${{ inputs.publish_id }}
          path: ${{ runner.temp }}/paragon-studio-publication/
          if-no-files-found: error
          retention-days: 7

  promote-main:
    name: Promote one production commit
    needs: build-shadow
    runs-on: ubuntu-latest
    outputs:
      final_commit: ${{ steps.promote.outputs.final_commit }}
    steps:
      - name: Check out exact draft commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.draft_commit }}
          fetch-depth: 2
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download publication evidence
        uses: actions/download-artifact@v4
        with:
          name: paragon-studio-publication-${{ inputs.publish_id }}
          path: ${{ runner.temp }}/paragon-studio-publication
      - name: Recheck pre-promotion conflict state
        run: >-
          node tools/paragon-live-pdf-workflow/validate-conflict-state.mjs
          --phase post-build
          --publish-id "${{ inputs.publish_id }}"
          --draft-branch "${{ inputs.draft_branch }}"
          --draft-commit "${{ inputs.draft_commit }}"
          --base-main-sha "${{ inputs.base_main_sha }}"
      - name: Create and fast-forward one production commit
        id: promote
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARAGON_STUDIO_PRODUCTION_ENABLED: ${{ vars.PARAGON_STUDIO_PRODUCTION_ENABLED }}
        run: >-
          node tools/paragon-live-pdf-workflow/promote-production-publication.mjs
          --output "${{ runner.temp }}/paragon-studio-publication/production"
          --publish-id "${{ inputs.publish_id }}"
          --draft-branch "${{ inputs.draft_branch }}"
          --draft-commit "${{ inputs.draft_commit }}"
          --base-main-sha "${{ inputs.base_main_sha }}"

  deploy-pages:
    name: Deploy exact promoted site
    needs: promote-main
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote-main.outputs.final_commit }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run permanent contracts
        run: npm test
      - name: Build exact promoted site
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify live publication
    needs:
      - promote-main
      - deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote-main.outputs.final_commit }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download publication evidence
        uses: actions/download-artifact@v4
        with:
          name: paragon-studio-publication-${{ inputs.publish_id }}
          path: ${{ runner.temp }}/paragon-studio-publication
      - name: Verify canonical and independent cache variants
        run: >-
          node tools/paragon-live-pdf-workflow/verify-live-publication.mjs
          --output "${{ runner.temp }}/paragon-studio-publication/production"
          --base-url https://paragonpurveyors.com/specials/
          --final-commit "${{ needs.promote-main.outputs.final_commit }}"
          --publish-id "${{ inputs.publish_id }}"

  cleanup-staging:
    name: Cleanup successful staging branch
    needs:
      - promote-main
      - deploy-pages
      - verify-live
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote-main.outputs.final_commit }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete successful staging reference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/paragon-live-pdf-workflow/cleanup-staging-reference.mjs
          --publish-id "${{ inputs.publish_id }}"

  report-production:
    name: Report production publication
    needs:
      - promote-main
      - deploy-pages
      - verify-live
      - cleanup-staging
    runs-on: ubuntu-latest
    steps:
      - name: Report verified production acceptance
        run: |
          echo "## Paragon Studio production publication verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication: ${{ inputs.publish_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production commit: ${{ needs.promote-main.outputs.final_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages deployment: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live HTML, JSON, and PDF: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging branch: removed after success" >> "$GITHUB_STEP_SUMMARY"
